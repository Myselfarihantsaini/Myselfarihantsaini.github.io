<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sun and Venus in the 1st House Kundali</title>
  <desc id="desc">North Indian Vedic kundali chart showing Sun and Venus placed in the first house.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="62%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f7efe1"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5a8"/>
      <stop offset="48%" stop-color="#f9b313"/>
      <stop offset="78%" stop-color="#f07a00"/>
      <stop offset="100%" stop-color="#b14d00"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9b6a12" flood-opacity="0.16"/>
    </filter>
    <style>
      .chart-line{fill:none;stroke:#bf7a00;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .outer-line{fill:none;stroke:#bf7a00;stroke-width:5.2;stroke-linejoin:round}
      .house-number{font-family:Georgia, 'Times New Roman', serif;font-size:54px;fill:#18120b}
      .planet-label{font-family:Georgia, 'Times New Roman', serif;font-size:32px;fill:#18120b}
      .venus{font-family:Georgia, 'Times New Roman', serif;font-size:118px;fill:#cf2f68}
      .sun-label{font-family:Georgia, 'Times New Roman', serif;font-size:30px;fill:#18120b}
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#paper)"/>

  <g filter="url(#softShadow)">
    <rect x="32" y="32" width="1136" height="1136" rx="12" class="outer-line"/>
    <rect x="46" y="46" width="1108" height="1108" rx="8" class="chart-line" opacity="0.72"/>

    <path class="chart-line" d="M600 42 L1158 600 L600 1158 L42 600 Z"/>
    <path class="chart-line" d="M42 42 L600 600 L42 1158"/>
    <path class="chart-line" d="M1158 42 L600 600 L1158 1158"/>
    <path class="chart-line" d="M42 42 L1158 1158"/>
    <path class="chart-line" d="M1158 42 L42 1158"/>

    <path d="M600 42 L880 322 L600 600 L320 322 Z" fill="#fff8e5" opacity="0.82"/>
    <path d="M600 42 L880 322 L600 600 L320 322 Z" class="chart-line"/>

    <text x="597" y="152" text-anchor="middle" class="house-number">1</text>
    <text x="225" y="180" text-anchor="middle" class="house-number">2</text>
    <text x="110" y="335" text-anchor="middle" class="house-number">3</text>
    <text x="130" y="610" text-anchor="middle" class="house-number">4</text>
    <text x="140" y="910" text-anchor="middle" class="house-number">5</text>
    <text x="285" y="1060" text-anchor="middle" class="house-number">6</text>
    <text x="600" y="1060" text-anchor="middle" class="house-number">7</text>
    <text x="915" y="1060" text-anchor="middle" class="house-number">8</text>
    <text x="1060" y="910" text-anchor="middle" class="house-number">9</text>
    <text x="1070" y="610" text-anchor="middle" class="house-number">10</text>
    <text x="1090" y="335" text-anchor="middle" class="house-number">11</text>
    <text x="975" y="180" text-anchor="middle" class="house-number">12</text>
  </g>

  <g transform="translate(480 244)">
    <g transform="translate(0 0)">
      <g transform="translate(0 0)">
        <circle cx="0" cy="0" r="48" fill="url(#sunGlow)"/>
        <circle cx="0" cy="0" r="58" fill="none" stroke="#f9a602" stroke-width="5"/>
        <g stroke="#f29a00" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="-88" x2="0" y2="-64"/>
          <line x1="0" y1="64" x2="0" y2="88"/>
          <line x1="-88" y1="0" x2="-64" y2="0"/>
          <line x1="64" y1="0" x2="88" y2="0"/>
          <line x1="-62" y1="-62" x2="-45" y2="-45"/>
          <line x1="45" y1="45" x2="62" y2="62"/>
          <line x1="62" y1="-62" x2="45" y2="-45"/>
          <line x1="-45" y1="45" x2="-62" y2="62"/>
          <line x1="-34" y1="-82" x2="-25" y2="-60"/>
          <line x1="34" y1="-82" x2="25" y2="-60"/>
          <line x1="-34" y1="82" x2="-25" y2="60"/>
          <line x1="34" y1="82" x2="25" y2="60"/>
        </g>
      </g>
      <text x="0" y="105" text-anchor="middle" class="sun-label">Sun</text>
    </g>
  </g>

  <g transform="translate(690 250)">
    <text x="0" y="22" text-anchor="middle" class="venus">♀</text>
    <text x="0" y="105" text-anchor="middle" class="planet-label">Venus</text>
  </g>
</svg>
