    <text x="34" y="145" font-family="Arial,sans-serif" font-size="24" fill="#ffffff">Brihat Parashara Hora Shastra</text>
    <text x="34" y="182" font-family="Arial,sans-serif" font-size="20" fill="#f3cf83">House indications and bhava judgment</text>
    <text x="34" y="236" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">Check Aries through:</text>
