    <text x="34" y="70" font-family="Georgia,serif" font-size="34" fill="#f8dc91">Aries Themes</text>
    <line x1="34" y1="95" x2="421" y2="95" stroke="#d6a855" opacity="0.55"/>
    <text x="34" y="150" font-family="Arial,sans-serif" font-size="23" fill="#ffffff">Where Aries sits, life asks for:</text>
    <text x="58" y="205" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• courage</text>
    <text x="58" y="248" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• initiative</text>
    <text x="58" y="291" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• action</text>
    <text x="58" y="334" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• competition</text>
    <text x="58" y="377" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• independence</text>
    <text x="58" y="420" font-family="Arial,sans-serif" font-size="22" fill="#f8dc91">• disciplined fire</text>
    <text x="34" y="505" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">Unevolved Aries reacts.</text>
    <text x="34" y="545" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">Evolved Aries acts with direction.</text>
    <text x="34" y="635" font-family="Georgia,serif" font-size="27" fill="#f8dc91">Courage, not chaos.</text>
