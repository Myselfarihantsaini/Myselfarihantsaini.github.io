    <text x="58" y="328" font-family="Arial,sans-serif" font-size="21" fill="#f8dc91">• Mars as sign lord</text>
    <text x="58" y="370" font-family="Arial,sans-serif" font-size="21" fill="#f8dc91">• dignity and aspects</text>
    <text x="58" y="412" font-family="Arial,sans-serif" font-size="21" fill="#f8dc91">• conjunctions</text>
    <text x="58" y="454" font-family="Arial,sans-serif" font-size="21" fill="#f8dc91">• dasha and transit</text>
    <text x="34" y="530" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">No single sign placement gives</text>
    <text x="34" y="565" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">complete prediction by itself.</text>
    <text x="34" y="635" font-family="Georgia,serif" font-size="27" fill="#f8dc91">Full chart first.</text>
  </g>
