name: Apply live transits

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-live-transits.yml'
      - '.github/scripts/apply_live_transits.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live transit patch
        run: python3 .github/scripts/apply_live_transits.py

      - name: Check JavaScript
        run: node --check js/main.js

      - name: Commit live transit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js
          if git diff --cached --quiet; then
            echo "No live transit changes to commit"
          else
            git commit -m "Use live navagraha transit data"
            git push
          fi
