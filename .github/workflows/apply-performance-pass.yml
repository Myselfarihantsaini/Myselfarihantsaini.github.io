name: Apply performance pass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-performance-pass.yml'
      - '.github/scripts/apply_performance_pass.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image optimizer
        run: python3 -m pip install --user pillow

      - name: Apply performance patch
        run: python3 .github/scripts/apply_performance_pass.py

      - name: Check JavaScript
        run: node --check js/main.js

      - name: Show optimized asset sizes
        run: ls -lh assets/om_bg.webp assets/logo-small.webp assets/service-career.webp assets/zodiac_wheel-640.webp

      - name: Commit performance patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No performance changes to commit"
          else
            git commit -m "Improve mobile performance"
            git push
          fi
