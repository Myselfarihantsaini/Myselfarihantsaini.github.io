name: Apply blog live cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-blog-live-fix.yml'
      - '.github/scripts/apply_blog_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 .github/scripts/apply_blog_cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply live blog cleanup"
            git push
          fi
