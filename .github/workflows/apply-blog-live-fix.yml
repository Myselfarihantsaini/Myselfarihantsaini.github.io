name: Apply blog live cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-blog-live-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply website cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          css = root / 'css' / 'styles.css'
          main_js = root / 'js' / 'main.js'
          post = root / 'post.html'
          data = root / 'js' / 'data.js'

          html = index.read_text()
          replacements = {
              '<title>Shambhava — Daily Vedic Astrology Insights & Horoscopes</title>': '<title>Shambhava — Vedic Astrology Services & Remedies</title>',
              '<meta name="description" content="Explore deep Vedic Astrology insights, daily horoscopes, planetary transits, and spiritual guidance. Free daily readings by Arihant Saini.">': '<meta name="description" content="Book Vedic Astrology consultations, divine guidance, practical remedies, transit clarity, and spiritual support with Shambhava.">',
              '<meta property="og:title" content="Shambhava — Daily Vedic Astrology">': '<meta property="og:title" content="Shambhava — Vedic Astrology Services">',
              '<meta property="og:description" content="Deep Vedic Astrology insights, daily horoscopes, and spiritual guidance.">': '<meta property="og:description" content="Vedic Astrology consultations, divine guidance, practical remedies, and spiritual support.">',
              '<meta name="twitter:title" content="Shambhava — Daily Vedic Astrology">': '<meta name="twitter:title" content="Shambhava — Vedic Astrology Services">',
              '<meta name="twitter:description" content="Deep Vedic Astrology insights, daily horoscopes, and spiritual guidance.">': '<meta name="twitter:description" content="Vedic Astrology consultations, divine guidance, practical remedies, and spiritual support.">',
              '<li><a href="#daily-insights">Insights</a></li>': '<li><a href="https://shambhavaa.blog" target="_blank" rel="noopener noreferrer">Blog</a></li>',
              '<li><a href="#daily-insights">Daily Insights</a></li>': '<li><a href="https://shambhavaa.blog" target="_blank" rel="noopener noreferrer">Blog</a></li>',
              "Guiding you through life's journey with ancient Vedic wisdom. Daily insights on planetary transits, nakshatras, and karmic patterns.": "Guiding you through life's journey with ancient Vedic wisdom, practical remedies, and clear consultation pathways.",
              '<div id="chart-container" style="position: relative; width: 100%; max-width: 350px; margin: 0 auto; aspect-ratio: 1/1; background: rgba(255,255,255,0.01); border: 2px solid var(--primary); border-radius: 4px;">': '<div id="chart-container" class="gochar-chart">',
              '    <script src="js/data.js?v=5.2"></script>\n': '',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          html = re.sub(r'\n    <!-- Daily Insights Section -->[\s\S]*?\n    </main>\n', '\n', html)
          html = re.sub(r'<li><a href="#daily-insights">(Planetary Transits|Daily Horoscope|Deep Dives|Remedies)</a></li>', r'<li><a href="https://shambhavaa.blog" target="_blank" rel="noopener noreferrer">\1</a></li>', html)
          for i in range(1, 13):
              html = re.sub(fr'<div id="house-{i}" style="[^"]*"></div>', fr'<div id="house-{i}" class="gochar-house house-{i}"></div>', html)
          index.write_text(html)

          js = main_js.read_text()
          js = js.replace("const elements = document.querySelectorAll('.post-card, .zodiac-card, .about-grid, .cta-content, .service-card, .product-card');", "const elements = document.querySelectorAll('.zodiac-card, .about-grid, .cta-content, .service-card, .product-card');")
          js = re.sub(r'\n// ---- Render Posts on Home Page ----\nfunction renderPosts\(\) \{[\s\S]*?\n\}\n\nasync function copyTextToClipboard', '\nasync function copyTextToClipboard', js)
          js = js.replace('            const retro = p.isRetro === "true" ? \' <span style="color: #ff4d4d;">(R)</span>\' : \'\';', '            const retro = p.isRetro === "true" ? \' <span class="retrograde-marker">(R)</span>\' : \'\';')
          js = js.replace('                ? `<span style="color: var(--primary-light); font-size: 0.8rem; display: block; margin-top: 4px;">${statuses[apiName][signNum]}</span>` ', '                ? `<span class="transit-status">${statuses[apiName][signNum]}</span>` ')
          js = re.sub(r'el\.innerHTML = `\n\s*<div style="font-size: 1\.1rem; color: var\(--text-light\);">\$\{signName\}</div>\n\s*<div style="font-size: 0\.85rem; color: var\(--text-muted\); margin-top: 2px;">\$\{degStr\}\$\{retro\}</div>\n\s*<div style="font-size: 0\.75rem; color: var\(--primary\); opacity: 0\.8; margin-top: 4px; font-weight: 600;">\$\{stayText\}</div>\n\s*\$\{status\}\n\s*`;', 'el.innerHTML = `\n                    <span class="transit-sign">${signName}</span>\n                    <span class="transit-degree">${degStr}${retro}</span>\n                    <span class="transit-stay">${stayText}</span>\n                    ${status}\n                `;', js)
          js = re.sub(r'const rashiLabel = document\.createElement\(\'div\'\);\n\s*rashiLabel\.style\.fontSize = "0\.7rem";\n\s*rashiLabel\.style\.color = "var\(--primary\)";\n\s*rashiLabel\.style\.marginBottom = "2px";\n\s*rashiLabel\.innerText = houseRashi;', "const rashiLabel = document.createElement('span');\n        rashiLabel.className = 'gochar-rashi';\n        rashiLabel.innerText = houseRashi;", js)
          js = re.sub(r'const pLabel = document\.createElement\(\'div\'\);\n\s*pLabel\.style\.fontSize = "0\.85rem";\n\s*pLabel\.style\.color = "var\(--text-light\)";\n\s*pLabel\.innerText = planetList\.join\(" "\);', "const pLabel = document.createElement('span');\n            pLabel.className = 'gochar-planets';\n            pLabel.innerText = planetList.join(' ');", js)
          js = re.sub(r'\n\s*safeInit\("Posts", renderPosts\);', '', js)
          main_js.write_text(js)

          styles = css.read_text()
          add = '''
/* ==================== TRANSIT GRID + GOCHAR CHART ==================== */
.transit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.transit-card { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 22px; border: 1px solid var(--border-subtle); border-radius: 16px; background: rgba(255,255,255,0.02); }
.transit-icon { display: flex; align-items: center; justify-content: center; flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; background: rgba(198,161,91,0.1); color: var(--primary); font-size: 2rem; line-height: 1; }
.transit-details { min-width: 0; }
.transit-sign, .transit-degree, .transit-stay, .transit-status { display: block; }
.transit-sign { color: var(--text-light); font-size: 1.05rem; line-height: 1.25; }
.transit-degree { margin-top: 2px; color: var(--text-muted); font-size: 0.85rem; line-height: 1.25; }
.transit-stay { margin-top: 4px; color: var(--primary); font-size: 0.75rem; font-weight: 600; line-height: 1.25; opacity: 0.85; }
.transit-status { margin-top: 4px; color: var(--primary-light); font-size: 0.8rem; line-height: 1.25; }
.retrograde-marker { color: #ff4d4d; }
.gochar-chart { position: relative; width: min(100%, 370px); margin: 0 auto; aspect-ratio: 1 / 1; border: 2px solid var(--primary); border-radius: 4px; background: rgba(255,255,255,0.01); }
.gochar-house { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 28px; padding: 1px 3px; color: var(--text-light); font-weight: 700; line-height: 1.05; text-align: center; pointer-events: none; transform: translate(-50%, -50%); }
.gochar-rashi { color: var(--primary); font-size: clamp(0.58rem, 2vw, 0.7rem); line-height: 1; }
.gochar-planets { max-width: 72px; color: var(--text-light); font-size: clamp(0.58rem, 2.2vw, 0.78rem); line-height: 1.12; white-space: normal; overflow-wrap: anywhere; }
.house-1 { top: 25%; left: 50%; width: 38%; } .house-2 { top: 12%; left: 25%; width: 34%; } .house-3 { top: 25%; left: 13%; width: 24%; } .house-4 { top: 50%; left: 25%; width: 34%; } .house-5 { top: 75%; left: 13%; width: 24%; } .house-6 { top: 88%; left: 25%; width: 34%; } .house-7 { top: 75%; left: 50%; width: 38%; } .house-8 { top: 88%; left: 75%; width: 34%; } .house-9 { top: 75%; left: 87%; width: 24%; } .house-10 { top: 50%; left: 75%; width: 34%; } .house-11 { top: 25%; left: 87%; width: 24%; } .house-12 { top: 12%; left: 75%; width: 34%; }
'''
          if '.gochar-chart' not in styles:
              styles = styles.replace('/* ==================== KUNDALI CHART (NORTH INDIAN) ==================== */', add + '\n/* ==================== KUNDALI CHART (NORTH INDIAN) ==================== */')
          css.write_text(styles)

          post.write_text('''<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhava Blog</title>
    <meta name="description" content="Shambhava articles now live on the Shambhavaa Blog.">
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0; url=https://shambhavaa.blog">
    <link rel="canonical" href="https://shambhavaa.blog">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container section" style="min-height: 70vh; display: grid; place-items: center; text-align: center;">
        <div>
            <span class="section-tag">Blog Moved</span>
            <h1>Visit the Shambhavaa Blog</h1>
            <p style="max-width: 560px; margin: 16px auto 28px; color: var(--text-main);">All astrology articles and cosmic guidance now live on the dedicated blog.</p>
            <a class="btn-primary" href="https://shambhavaa.blog">Open Blog</a>
        </div>
    </main>
    <script>
        window.location.replace('https://shambhavaa.blog');
    </script>
</body>
</html>
''')
          if data.exists():
              data.unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html css/styles.css js/main.js post.html js/data.js
          if git diff --cached --quiet; then
            echo "No website cleanup changes needed."
          else
            git commit -m "Apply live blog cleanup"
            git push
          fi
