name: Apply performance pass 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-performance-pass2.yml'
      - '.github/scripts/apply_performance_pass2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply second performance patch
        run: python3 .github/scripts/apply_performance_pass2.py

      - name: Check JavaScript
        run: node --check js/main.js

      - name: Commit second performance patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No performance changes to commit"
          else
            git commit -m "Reduce homepage payload further"
            git push
          fi
